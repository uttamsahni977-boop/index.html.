        // Render Dots Pagination inside cards
        function renderDots() {
            const dotsContainers = document.querySelectorAll('#pagination-dots-card');
            dotsContainers.forEach((container, containerIdx) => {
                container.innerHTML = '';
                for (let i = 0; i < totalSlides; i++) {
                    const dot = document.createElement('span');
                    dot.className = `h-1.5 rounded-full transition-all duration-300 ${i === currentSlide ? 'w-5 bg-pink-500' : 'w-1.5 bg-zinc-700'}`;
                    container.appendChild(dot);
                }
            });
        }

        function updateCarouselPosition() {
            const track = document.getElementById('carousel-track');
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
            renderDots();
        }

        function nextSlide() {
            if (currentSlide < totalSlides - 1) {
                currentSlide++;
                updateCarouselPosition();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                updateCarouselPosition();
            }
        }

        // Language Switcher Logic
        function setLanguage(lang) {
            currentLang = lang;
            ['en', 'hi', 'hinglish'].forEach(l => {
                const btn = document.getElementById(`lang-${l}`);
                if (l === lang) {
                    btn.className = "px-3 py-1 text-xs font-semibold rounded-full transition-all duration-300 bg-gradient-to-r from-pink-600 to-rose-600 text-white font-bold shadow-md";
                } else {
                    btn.className = "px-3 py-1 text-xs font-semibold rounded-full transition-all duration-300 text-zinc-400 hover:text-white";
                }
            });

            if (lang === 'hi') {
                document.getElementById('profile-subtitle').innerText = "पूर्ण डिजिटल स्टोरीबुक (8 अध्याय)";
                document.getElementById('footer-swipe-hint').innerHTML = '<i class="fa-solid fa-arrow-pointer text-pink-500 animate-pulse"></i> चैप्टर बदलने के लिए होरिजेंटल स्वाइप करें या एरो बटन दबाएं';
            } else if (lang === 'en') {
                document.getElementById('profile-subtitle').innerText = "Complete Storybook (8 Chapters)";
                document.getElementById('footer-swipe-hint').innerHTML = '<i class="fa-solid fa-arrow-pointer text-pink-500 animate-pulse"></i> Swipe horizontally or use arrow buttons to navigate chapters';
            } else {
                document.getElementById('profile-subtitle').innerText = "Complete Storybook (8 Chapters)";
                document.getElementById('footer-swipe-hint').innerHTML = '<i class="fa-solid fa-arrow-pointer text-pink-500 animate-pulse"></i> Chapters switch karne ke liye horizontal swipe karein';
            }

            renderSlides();
        }

        // Copy Instagram ID functionality
        function copyInstagramID() {
            const dummy = document.createElement('textarea');
            dummy.value = 'uttam13_03_2008';
            document.body.appendChild(dummy);
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            showToast(currentLang === 'hi' ? 'इंस्टाग्राम आईडी कॉपी हो गई! 🎉' : 'Instagram ID copied successfully! 🎉');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Touch & Swipe Support for Mobile Carousel
        let touchStartX = 0;
        let touchEndX = 0;

        const trackElement = document.getElementById('carousel-track');
        trackElement.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        trackElement.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                nextSlide();
            }
            if (touchEndX > touchStartX + 50) {
                prevSlide();
            }
        }

        // Keyboard Arrow Navigation
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Initial Load
        window.onload = () => {
            renderSlides();
        };
